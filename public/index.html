<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#262a78" />
<title>Feel So Good · 무대 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  @font-face { font-family: 'Audiowide'; src: url('/fonts/audiowide.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Share Tech Mono'; src: url('/fonts/sharetechmono.woff2') format('woff2'); font-display: swap; }
  :root {
    --indigo: #262a78;
    --indigo-2: #3a3f9e;
    --lav: #b8bdf6;
    --lav-2: #dfe2ff;
    --lime: #c8f25a;
    --teal: #3cc7b4;
    --ink: #f3f4ff;
    --muted: #a9addf;
    --glass: rgba(34, 37, 110, 0.62);
    --line: rgba(184, 189, 246, 0.28);
    --display: 'Audiowide', 'Pretendard', sans-serif;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--indigo);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- 배경: 포스터 질감 + 남보라 그라데이션 + 스캔라인 ---------- */
  .bg {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -3;
    background:
      linear-gradient(180deg, rgba(38, 42, 120, 0.55) 0%, rgba(38, 42, 120, 0.78) 45%, rgba(22, 24, 74, 0.95) 100%),
      url('/bg.jpg') center / cover no-repeat;
  }
  .scan {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  /* 포스터 왼쪽의 암호 같은 글자 기둥 */
  .glyphs {
    position: fixed; top: 0; bottom: 0; left: 0; width: 46%; z-index: -2; overflow: hidden;
    font-family: var(--mono); font-size: 11px; line-height: 1.55; letter-spacing: 0.35em;
    color: var(--lav-2); opacity: 0.22; white-space: pre; padding: 6px 0 0 8px;
    -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent);
            mask-image: linear-gradient(90deg, #000 40%, transparent);
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px 40px; position: relative; }

  /* ---------- 헤더 ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .topbar b { color: var(--ink); font-weight: 700; }
  .hero { position: relative; margin-top: 18px; padding: 8px 0 4px; }
  .eq { position: absolute; right: 0; top: 0; height: 120px; width: 62%; display: flex; align-items: flex-end; gap: 4px; opacity: 0.5; }
  .eq i { flex: 1; background: var(--lav); border-radius: 1px; height: 30%; animation: eq 1.2s ease-in-out infinite alternate; }
  @keyframes eq { 0% { height: 18%; } 100% { height: 100%; } }
  .brand {
    position: relative; font-family: var(--display); font-size: 58px; line-height: 0.98; margin: 0;
    color: var(--ink); letter-spacing: 0.01em;
    text-shadow: 2px 2px 0 var(--lav), -1px -1px 0 rgba(255,255,255,0.4), 0 0 22px rgba(184,189,246,0.35);
  }
  .brand span { display: block; }
  .tagline { font-family: var(--display); font-size: 17px; margin-top: 14px; color: var(--lav-2); letter-spacing: 0.02em; }
  .event { font-size: 16px; font-weight: 700; margin-top: 4px; }
  .when { margin-top: 10px; font-size: 14px; color: var(--lav-2); font-weight: 600; }
  .when b { color: var(--ink); font-weight: 800; }
  /* 무대가 진행 중일 땐 헤더를 줄여서 투표 버튼이 한 화면에 들어오게 */
  body.active .hero { margin-top: 10px; }
  body.active .brand { font-size: 30px; display: flex; gap: 10px; }
  body.active .brand span { display: inline; }
  body.active .eq { height: 46px; width: 40%; }
  body.active .tagline, body.active .when { display: none; }
  body.active .event { font-size: 14px; margin-top: 6px; color: var(--lav-2); }
  body.active .band { margin-top: 14px; height: 28px; }
  body.active .panel { margin-top: 14px; padding-top: 16px; }
  body.active .vote { margin-top: 18px; }

  /* ---------- 라임 글리치 띠 ---------- */
  .band { position: relative; margin: 22px -18px 0; height: 34px; overflow: hidden;
    background: linear-gradient(90deg, rgba(60,199,180,0.0), var(--lime) 18%, #b5ef4a 60%, rgba(60,199,180,0.85));
    box-shadow: 0 6px 0 -2px rgba(60,199,180,0.55), 0 -5px 0 -2px rgba(184,189,246,0.35);
  }
  .band .track { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%);
    font-family: var(--display); font-size: 13px; color: #1d2160; letter-spacing: 0.08em;
    animation: marquee 18s linear infinite; }
  @keyframes marquee { from { transform: translate(0, -50%); } to { transform: translate(-50%, -50%); } }
  .band2 { height: 4px; margin: 6px -18px 0; background: linear-gradient(90deg, var(--teal), transparent 70%); opacity: 0.8; }

  /* ---------- 지금 무대 ---------- */
  .panel {
    margin-top: 22px; background: var(--glass); border: 1px solid var(--line);
    border-radius: 4px; padding: 22px 18px 24px; text-align: center; position: relative;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .panel::before, .panel::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--lime); }
  .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .status {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--display); font-size: 12px; letter-spacing: 0.12em;
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--lav-2);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: #ff5f7e; animation: blink 1s infinite; }
  .status.open { color: #1d2160; background: var(--lime); border-color: var(--lime); }
  .status.open .dot { background: #1d2160; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .song-title {
    font-size: 30px; font-weight: 900; margin: 16px 0 4px; letter-spacing: -0.02em; word-break: keep-all; line-height: 1.2;
    text-shadow: -2px 0 rgba(60,199,180,0.75), 2px 0 rgba(200,242,90,0.55);
  }
  .song-artist { color: var(--lav-2); font-size: 15px; }
  .team { display: inline-block; margin-top: 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 2px; }
  .team-A { background: var(--lime); color: #1d2160; }
  .team-B { background: var(--lav); color: #1d2160; }

  button { font: inherit; border: 0; cursor: pointer; }
  .vote {
    position: relative; display: block; width: 186px; height: 186px; margin: 26px auto 14px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #e6ff9e, var(--lime) 45%, #8fd13a);
    color: #1d2160; font-family: var(--display); font-size: 18px; letter-spacing: 0.06em;
    box-shadow: -5px 0 0 rgba(60,199,180,0.65), 5px 0 0 rgba(184,189,246,0.55), 0 14px 40px rgba(200,242,90,0.35);
    transition: transform 0.1s;
  }
  .vote .h { display: block; font-size: 58px; line-height: 1; margin-bottom: 6px; font-family: 'Pretendard', sans-serif; }
  /* FSG 로고 아이콘: 버튼 글자색을 그대로 따라감 */
  .vote .logo { display: block; width: 70px; height: 70px; margin: 0 auto 4px; background: currentColor;
    -webkit-mask: url('/fsg-logo.png') center / contain no-repeat; mask: url('/fsg-logo.png') center / contain no-repeat; }
  .vote.wait .logo { opacity: 0.55; }
  .vote small { display: block; font-family: 'Pretendard', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0; margin-top: 2px; }
  .vote:active:not(:disabled) { transform: scale(0.94); }
  .vote.pulse::after { content: ''; position: absolute; top: -10px; right: -10px; bottom: -10px; left: -10px; border-radius: 50%; border: 2px solid var(--lime); animation: ring 1.4s infinite; }
  @keyframes ring { from { transform: scale(0.95); opacity: 0.9; } to { transform: scale(1.18); opacity: 0; } }
  .vote:disabled { cursor: default; }
  /* 한 번 투표한 뒤: 더 밝고 강하게 */
  .vote.again {
    background: radial-gradient(circle at 32% 28%, #f6ffd2, #dcff6e 40%, var(--lime) 70%, #7fd12a);
    box-shadow: -6px 0 0 rgba(60,199,180,0.85), 6px 0 0 rgba(184,189,246,0.75), 0 0 0 6px rgba(200,242,90,0.25), 0 16px 56px rgba(200,242,90,0.6);
    transform: scale(1.04); animation: throb 1s ease-in-out infinite;
  }
  .vote.again .logo { width: 80px; height: 80px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.9)); }
  .vote.again::before { content: ''; position: absolute; top: -20px; right: -20px; bottom: -20px; left: -20px; border-radius: 50%; border: 2px solid rgba(200,242,90,0.6); animation: ring 1.4s 0.5s infinite; }
  .vote.again:active { transform: scale(0.96); animation: none; }
  @keyframes throb { 50% { transform: scale(1.08); } }
  .pips { display: flex; justify-content: center; gap: 14px; margin: 6px 0 12px; }
  .pips i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--lime); opacity: 0.7; transition: all 0.3s; }
  .pips i.on { background: var(--lime); opacity: 1; box-shadow: 0 0 10px var(--lime), 0 0 22px rgba(200,242,90,0.6); }
  .vote.wait { background: transparent; color: var(--muted); border: 2px dashed var(--line); box-shadow: none; }
  .vote.done { background: radial-gradient(circle at 32% 28%, #ffffff, var(--lav) 55%, #8d93e6); box-shadow: 0 14px 40px rgba(184,189,246,0.35); }
  .hint { font-size: 13px; color: var(--lav-2); }

  /* ---------- 결과 ---------- */
  .sec { font-family: var(--display); font-size: 15px; letter-spacing: 0.14em; margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; color: var(--lav-2); }
  .sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  /* FSG 로고 아이콘 (글자색을 따라감) */
  .fsg { display: inline-block; width: 0.95em; height: 1.3em; vertical-align: -0.3em; background: currentColor;
    -webkit-mask: url('/fsg-logo.png') center / contain no-repeat; mask: url('/fsg-logo.png') center / contain no-repeat; }
  /* 곡별 득표 순위 */
  .ranking { list-style: none; margin: 0; padding: 4px 12px; background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .ranking li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .ranking li:last-child { border-bottom: 0; }
  .ranking .pos { font-size: 17px; font-weight: 900; color: var(--muted); text-align: center; }
  .ranking li.top .pos { color: var(--lime); font-size: 20px; }
  .ranking li.top1 { background: linear-gradient(90deg, rgba(200,242,90,0.16), transparent); margin: 0 -12px; padding-left: 14px; padding-right: 14px; }
  .ranking .t { min-width: 0; }
  .ranking .t b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ranking .t small { color: var(--muted); font-size: 12px; }
  .ranking .t .team { margin: 0 6px 0 0; padding: 1px 6px; font-size: 10px; vertical-align: 2px; }
  .ranking .v { font-weight: 900; font-size: 16px; white-space: nowrap; }
  .ranking .bar { grid-column: 2 / -1; height: 4px; background: rgba(16,18,60,0.6); margin-top: -4px; }
  .ranking .bar i { display: block; height: 100%; }
  .ranking li.zero .t b, .ranking li.zero .v { color: var(--muted); }

  /* ---------- 셋리스트 ---------- */
  .setlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .setlist li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .setlist .no { font-size: 15px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .setlist .t { min-width: 0; }
  .setlist .t b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .setlist .t small { color: var(--muted); font-size: 12px; }
  .setlist .t .team { margin: 0 6px 0 0; padding: 1px 6px; font-size: 10px; vertical-align: 2px; }
  .setlist li.cur { background: linear-gradient(90deg, rgba(200,242,90,0.16), transparent); }
  .setlist li.cur .no { color: var(--lime); }
  .mark { font-size: 12px; font-weight: 800; color: var(--lime); white-space: nowrap; }

  .foot { text-align: center; margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .foot b { font-family: var(--display); font-weight: 400; color: var(--lav-2); letter-spacing: 0.08em; }

  /* 마감 카운트다운: 로고 위 숫자 */
  .logo-box { position: relative; display: block; width: 70px; height: 70px; margin: 0 auto 4px; }
  .vote.again .logo-box { width: 80px; height: 80px; }
  .logo-box .logo { width: 100% !important; height: 100% !important; margin: 0 !important; opacity: 0.25; }
  .logo-box .cd { position: absolute; top: -6px; right: -6px; bottom: -6px; left: -6px; display: grid; place-items: center; font-family: var(--display); font-size: 58px; line-height: 1;
    color: currentColor; text-shadow: 0 0 12px rgba(255,255,255,0.85); }
  .cd.tick, .cdtxt.tick { animation: tick 0.35s ease-out; }
  @keyframes tick { from { transform: scale(1.35); } }
  .hint.closing { color: var(--lime); font-weight: 800; font-size: 15px; }
  .hint.closing b { display: inline-block; font-size: 18px; margin: 0 1px; }
  /* 투표 확인 창 */
  .ask { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 24px;
    background: rgba(12, 14, 50, 0.72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .ask.show { display: flex; animation: fade 0.15s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .ask .box { position: relative; width: 100%; max-width: 340px; background: #2b2f86; border: 1px solid var(--line); border-radius: 4px;
    padding: 24px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.45); animation: pop 0.18s ease-out; }
  @keyframes pop { from { transform: scale(0.92); } }
  .ask .box::before, .ask .box::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--lime); }
  .ask .box::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .ask .box::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .ask .mark-logo { width: 48px; height: 48px; margin: 0 auto 10px; background: var(--lime);
    -webkit-mask: url('/fsg-logo.png') center / contain no-repeat; mask: url('/fsg-logo.png') center / contain no-repeat; }
  .ask .q { font-size: 19px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
  .ask .q b { color: var(--lime); }
  .ask .sub { margin-top: 6px; font-size: 13px; color: var(--lav-2); }
  .ask .btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 20px; }
  .ask .btns button { padding: 13px 0; border-radius: 3px; font-size: 15px; font-weight: 800; }
  .ask .no { background: rgba(184,189,246,0.14); color: var(--ink); border: 1px solid var(--line); }
  .ask .yes { background: var(--lime); color: #1d2160; box-shadow: -3px 0 0 var(--teal), 3px 0 0 var(--lav); }
  /* 연결 끊김 표시 */
  .net { position: fixed; left: 50%; top: 12px; transform: translate(-50%, -160%); z-index: 20;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    background: #ff5f7e; color: #fff; font-weight: 800; font-size: 14px; padding: 9px 16px; border-radius: 3px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35); transition: transform 0.25s; }
  .net.show { transform: translate(-50%, 0); }
  .net .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    background: var(--lime); color: #1d2160; font-weight: 800; padding: 10px 18px; border-radius: 2px;
    box-shadow: -3px 0 0 var(--teal), 3px 0 0 var(--lav);
    opacity: 0; transition: opacity 0.2s; pointer-events: none; font-size: 14px;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .eq i, .band .track, .vote.pulse::after, .vote.again, .vote.again::before, .status .dot { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="glyphs" id="glyphs" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<div class="wrap">
  <div class="topbar"><span>흑인음악동아리 <b>FEEL SO GOOD</b></span><span>한양대학교 ERICA</span></div>

  <header class="hero">
    <div class="eq" id="eq" aria-hidden="true"></div>
    <h1 class="brand"><span>Feel</span><span>So</span><span>Good</span></h1>
    <div class="tagline">: The generation . . .</div>
    <div class="event" id="eventTitle"></div>
    <div class="when"><b>11/26 THU</b> · 학생회관 소극장 <b>19:00</b></div>
  </header>

  <div class="band"><div class="track" id="track"></div></div>
  <div class="band2"></div>

  <section class="panel" id="now"></section>

  <div id="resultsBox" hidden>
    <div class="sec">TOP 5</div>
    <ol class="ranking" id="ranking"></ol>
  </div>

  <div class="sec">SETLIST</div>
  <ul class="setlist" id="setlist"></ul>

  <div class="foot">
    <div id="eventInfo" style="white-space: pre-line"></div>
    <b>ONE LAST TIME, THIS SEMESTER!</b>
  </div>
</div>
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askQ">
  <div class="box">
    <div class="mark-logo" aria-hidden="true"></div>
    <div class="q" id="askQ"></div>
    <div class="sub" id="askSub"></div>
    <div class="btns"><button class="no" id="askNo">취소</button><button class="yes" id="askYes">투표하기</button></div>
  </div>
</div>
<div class="net" id="net" role="status" aria-live="polite"><span class="spin"></span>연결이 끊겼어요 · 다시 연결하는 중…</div>
<div class="toast" id="toast"></div>

<script>
let S = null;
let sending = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 장식 요소 (포스터 모티프) ----------
(function decorate() {
  // 이퀄라이저 막대
  const eq = $('eq');
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('i');
    b.style.animationDelay = (-Math.random() * 1.2).toFixed(2) + 's';
    b.style.animationDuration = (0.8 + Math.random() * 0.9).toFixed(2) + 's';
    eq.appendChild(b);
  }
  // 흐르는 문구
  const unit = 'ONE LAST TIME, THIS SEMESTER! ✦ FEEL SO GOOD ✦ 2026-2 FSG 정기공연 ✦ ';
  $('track').textContent = unit.repeat(6);
  // 암호 글자 기둥
  const set = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ<>∧∨⊐⊏ΞЭШZXNM_';
  let out = '';
  for (let r = 0; r < 70; r++) {
    const len = 6 + Math.floor(Math.random() * 22);
    let line = '';
    for (let c = 0; c < len; c++) line += set[Math.floor(Math.random() * set.length)];
    out += line + '\n';
  }
  $('glyphs').textContent = out;
})();

// 서버 쿠키가 지워져도 같은 브라우저에서 투표 횟수가 화면에 반영되도록 로컬에도 기록.
// 운영진이 '전체 투표 초기화'를 하면 epoch 값이 바뀌고, 그때 로컬 기록도 비웁니다.
const LS = 'voted3';
function readLocal() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }
function writeLocal(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch {} }
function syncEpoch(epoch) {
  try { localStorage.removeItem('voted'); localStorage.removeItem('voted2'); } catch {}
  const o = readLocal();
  if (o.epoch !== epoch) writeLocal({ epoch, counts: {} });
}
function localCounts() { const o = readLocal(); return S && o.epoch === S.epoch ? o.counts || {} : {}; }
function setLocal(id, n) { const o = readLocal(); if (!S || o.epoch !== S.epoch) return; o.counts = o.counts || {}; o.counts[id] = Math.max(o.counts[id] || 0, n); writeLocal(o); }

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- 연결 상태 감시 ----------
// 2번 연속 실패하거나 기기가 오프라인이 되면 '연결 끊김' 표시, 다시 성공하면 자동으로 숨김
const NET = { fails: 0, down: false };
async function fetchT(url, opts = {}, ms = 6000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); } finally { clearTimeout(t); }
}
function showNet(on) { const n = document.getElementById('net'); if (n) n.classList.toggle('show', on); }
function netOk() { NET.fails = 0; if (NET.down) { NET.down = false; showNet(false); if (typeof toast === 'function') toast('다시 연결됐어요'); } }
function netFail() { NET.fails++; if (!NET.down && (NET.fails >= 2 || !navigator.onLine)) { NET.down = true; showNet(true); } }
window.addEventListener('offline', () => { NET.down = true; showNet(true); });
window.addEventListener('online', () => load());

// ---------- 마감 카운트다운 ----------
// 서버가 알려준 남은 시간으로 이 기기의 마감 시각을 계산하고, 0.2초마다 [data-cd] 숫자를 갱신
let deadline = null, cdReload = false;
function syncDeadline(st) {
  if (st && st.closing && st.closeIn != null) { const d = Date.now() + st.closeIn; if (!deadline || Math.abs(d - deadline) > 800) deadline = d; }
  else deadline = null;
}
function secsLeft() { return deadline ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) : ''; }
setInterval(() => {
  if (!deadline) return;
  const n = String(secsLeft());
  document.querySelectorAll('[data-cd]').forEach((e) => {
    if (e.textContent !== n) { e.textContent = n; e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick'); }
  });
  if (n === '0' && !cdReload) { cdReload = true; setTimeout(() => { cdReload = false; load(); }, 500); }
}, 200);

let lastKey = '';
async function load() {
  try {
    const r = await fetchT('/api/state', { credentials: 'same-origin', cache: 'no-store' });
    S = await r.json();
    netOk();
    syncEpoch(S.epoch);
    syncDeadline(S);
    // 바뀐 게 있을 때만 다시 그려서 버튼 누르는 순간 화면이 교체되지 않게 함
    const key = JSON.stringify([{ ...S, closeIn: null }, localCounts()]);
    if (key !== lastKey) { lastKey = key; render(); }
  } catch { netFail(); }
}

const MAXV = () => S.votesPerSong || 2;
function myCount(id) { return Math.min(MAXV(), Math.max((S.myCounts || {})[id] || 0, localCounts()[id] || 0)); }
const pips = (n) => `<div class="pips">${Array.from({ length: MAXV() }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;
const pad = (n) => String(n).padStart(2, '0');

function render() {
  $('eventTitle').textContent = S.eventTitle;
  $('eventInfo').textContent = S.eventInfo;
  document.title = 'Feel So Good · ' + S.eventTitle;

  const c = S.current;
  const now = $('now');
  document.body.classList.toggle('active', !!c && S.phase !== 'idle');
  if (asking && (!c || c.id !== asking || S.phase !== 'voting' || myCount(asking) >= MAXV())) {
    closeAsk();
    if (S.phase !== 'voting') toast('투표가 마감됐어요');
  }
  if (!c || S.phase === 'idle') {
    now.innerHTML = `<span class="status"><span class="dot"></span>STANDBY</span>
      <div class="song-title" style="font-size:24px">곧 무대가 시작돼요</div>
      <div class="song-artist">무대가 끝날 때마다 이 화면에서 투표가 열려요</div>
      <button class="vote wait" disabled><span class="logo" aria-hidden="true"></span>MIC CHECK</button>
      <div class="hint">화면을 켜 둔 채로 기다려 주세요</div>`;
  } else {
    const st = S.phase === 'performing' ? ['live', 'LIVE NOW'] : S.phase === 'voting' ? (S.closing ? ['open', 'LAST CALL'] : S.onStage ? ['live', 'LIVE NOW'] : ['open', 'VOTE OPEN']) : ['', 'VOTE CLOSED'];
    const head = `<span class="status ${st[0]}"><span class="dot"></span>${st[1]}</span>
      <div><span class="team team-${c.team}">${esc(S.teams[c.team])}</span></div>
      <div class="song-title">${esc(c.title)}</div>
      <div class="song-artist">${esc(c.artist)}</div>`;
    let btn = '';
    const n = myCount(c.id);
    if (S.phase === 'voting' && n === 0) {
      btn = `<button class="vote pulse" id="voteBtn"><span class="logo" aria-hidden="true"></span>FEEL SO GOOD<small>이 무대 좋았어요!</small></button>
        ${pips(0)}<div class="hint">무대마다 두 번까지 투표할 수 있어요</div>`;
    } else if (S.phase === 'voting' && n < MAXV()) {
      btn = `<button class="vote again" id="voteBtn"><span class="logo" aria-hidden="true"></span>ONE MORE<small>한 번 더 투표하기</small></button>
        ${pips(n)}<div class="hint">정말 좋았다면 한 번 더!</div>`;
    } else if (n >= MAXV()) {
      btn = `<button class="vote done" disabled><span class="logo" aria-hidden="true"></span>✓ VOTED ×${n}<small>투표를 마쳤어요</small></button>
        ${pips(n)}<div class="hint">다음 무대도 기대해 주세요</div>`;
    } else if (n > 0) {
      btn = `<button class="vote done" disabled><span class="logo" aria-hidden="true"></span>✓ VOTED<small>마음을 남겼어요</small></button>
        ${pips(n)}<div class="hint">다음 무대를 기다려 주세요</div>`;
    } else if (S.phase === 'performing') {
      btn = `<button class="vote wait" disabled><span class="logo" aria-hidden="true"></span>ON STAGE<small>공연 후 열려요</small></button>
        <div class="hint">무대가 끝나면 버튼이 켜져요</div>`;
    } else {
      btn = `<button class="vote wait" disabled><span class="logo" aria-hidden="true"></span>CLOSED<small>투표 마감</small></button>
        <div class="hint">다음 무대를 기다려 주세요</div>`;
    }
    if (S.phase === 'voting' && S.closing) {
      // 마감 10초 카운트다운: 로고 위에 숫자, 안내 문구도 카운트다운으로
      btn = btn.replace('<span class="logo" aria-hidden="true"></span>',
        `<span class="logo-box"><span class="logo" aria-hidden="true"></span><span class="cd" data-cd>${secsLeft()}</span></span>`)
        .replace(/<div class="hint">[^<]*<\/div>/, `<div class="hint closing">투표 마감까지 <b class="cdtxt" data-cd>${secsLeft()}</b>초!</div>`);
    }
    now.innerHTML = head + btn;
    const vb = $('voteBtn');
    if (vb) vb.onclick = () => askVote(c);
  }

  // 결과
  const rb = $('resultsBox');
  const res = S.showResults && S.results;
  rb.hidden = !res;
  if (res) {
    // 득표순 정렬, 동점은 같은 순위 (같은 표수 안에서는 공연 순서대로)
    const sorted = [...res.songs].sort((a, b) => b.votes - a.votes || a.order - b.order);
    const max = Math.max(1, sorted[0] ? sorted[0].votes : 1);
    let pos = 0;
    const ranked = sorted.map((s, i) => { if (i === 0 || s.votes !== sorted[i - 1].votes) pos = i + 1; return { ...s, pos }; })
      .filter((s) => s.pos <= 5 && s.votes > 0);
    $('ranking').innerHTML = ranked.length ? ranked.map((s) => {
      const pos = s.pos;
      const cls = [s.votes > 0 && pos <= 3 ? 'top' : '', s.votes > 0 && pos === 1 ? 'top1' : '', s.votes === 0 ? 'zero' : ''].join(' ');
      return `<li class="${cls}">
        <span class="pos">${pos}</span>
        <span class="t"><b>${esc(s.title)}</b><small><span class="team team-${s.team}">${esc(S.teams[s.team])}</span>${esc(s.artist)}</small></span>
        <span class="v"><span class="fsg" aria-hidden="true"></span> ${s.votes}</span>
        <div class="bar"><i style="width:${(s.votes / max) * 100}%;background:var(--${s.team === 'A' ? 'lime' : 'lav'})"></i></div>
      </li>`;
    }).join('') : '<li><span></span><span class="t"><b>아직 집계된 표가 없어요</b></span></li>';
  }

  $('setlist').innerHTML = S.songs.map((s) => `
    <li class="${c && s.id === c.id && S.phase !== 'idle' ? 'cur' : ''}">
      <span class="no">${pad(s.order)}</span>
      <span class="t"><b>${esc(s.title)}</b><small><span class="team team-${s.team}">${esc(S.teams[s.team])}</span>${esc(s.artist)}</small></span>
      ${myCount(s.id) ? `<span class="mark">${'<span class="fsg" aria-hidden="true"></span>'.repeat(myCount(s.id))} VOTED</span>` : ''}
    </li>`).join('');
}

// ---------- 투표 전 확인 ----------
let asking = null; // 확인 창을 띄운 곡 id
function askVote(c) {
  const n = myCount(c.id);
  $('askQ').innerHTML = n === 0
    ? `<b>${esc(c.title)}</b>에<br />투표할까요?`
    : `<b>${esc(c.title)}</b>에<br />두 번째 투표를 할까요?`;
  $('askSub').textContent = n === 0 ? '무대마다 두 번까지 투표할 수 있어요' : '두 번째 투표를 하면 이 무대 투표는 끝나요';
  $('askYes').textContent = n === 0 ? '투표하기' : '한 번 더 투표하기';
  asking = c.id;
  $('ask').classList.add('show');
}
function closeAsk() { asking = null; $('ask').classList.remove('show'); }
$('askNo').onclick = closeAsk;
$('ask').onclick = (e) => { if (e.target.id === 'ask') closeAsk(); };
$('askYes').onclick = () => { const id = asking; closeAsk(); if (id) vote(id); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAsk(); });

async function vote(songId) {
  if (sending) return;
  sending = true;
  try {
    if (NET.down) toast('연결이 불안정해요. 연결되면 다시 눌러주세요');
    const r = await fetchT('/api/vote', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ songId }) });
    const d = await r.json();
    if (r.ok) {
      setLocal(songId, d.count || 1);
      if (navigator.vibrate) navigator.vibrate(d.count >= (d.max || 2) ? [40, 60, 40] : 40);
      toast(d.count >= (d.max || 2) ? '두 번 모두 투표했어요! FEEL SO GOOD' : '투표 완료! 한 번 더 할 수 있어요');
    } else {
      if (d.count) setLocal(songId, d.count);
      toast(d.error || '투표에 실패했어요');
    }
  } catch { netFail(); toast('연결 문제로 투표가 안 됐어요. 다시 눌러주세요'); }
  sending = false;
  load();
}

// 화면을 보고 있을 땐 2초마다, 꺼져 있거나 다른 앱에 가 있으면 8초마다 확인 (서버 부담 줄이기)
// 화면으로 돌아오면 바로 한 번 확인
let pollT = null;
function schedule() { clearTimeout(pollT); pollT = setTimeout(async () => { await load(); schedule(); }, document.hidden ? 8000 : 2000); }
load().then(schedule);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); schedule(); });
</script>
</body>
