<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Feel So Good · 대형 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  @font-face { font-family: 'Audiowide'; src: url('/fonts/audiowide.woff2') format('woff2'); font-display: swap; }
  :root {
    --ink: #f3f4ff; --muted: #c3c6f0; --lime: #c8f25a; --lav: #b8bdf6; --navy: #1d2160;
    /* 팀 색: OB = 라임·초록, YB = 보라 */
    --ob: #c8f25a; --ob-deep: #3fae4a;
    --yb: #c39bff; --yb-deep: #7a3cff;
    --team: transparent; --team-deep: transparent;
    --display: 'Audiowide', 'Pretendard', sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #1d2160; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
  body[data-team="A"] { --team: var(--ob); --team-deep: var(--ob-deep); }
  body[data-team="B"] { --team: var(--yb); --team-deep: var(--yb-deep); }

  /* ---------- 배경: 포스터 이미지 + 팀 색 입히기 ---------- */
  .bg { position: fixed; inset: 0; background: url('/screen-bg.jpg') center / cover no-repeat; z-index: -4; }
  /* 팀 차례일 때 화면 전체 색감을 팀 색으로 */
  .tint { position: fixed; inset: 0; z-index: -3; background: var(--team-deep); mix-blend-mode: color; opacity: 0; transition: opacity 0.8s, background 0.8s; }
  .tint2 { position: fixed; inset: 0; z-index: -2; opacity: 0; transition: opacity 0.8s;
    background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--team) 35%, transparent), transparent 60%),
                linear-gradient(0deg, color-mix(in srgb, var(--team-deep) 30%, transparent), transparent 40%); }
  body[data-team] .tint { opacity: 0.55; }
  body[data-team] .tint2 { opacity: 1; }
  /* 팀 색 테두리 */
  .frame { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.6s;
    box-shadow: inset 0 0 0 0.55vw var(--team), inset 0 0 3vw color-mix(in srgb, var(--team) 60%, transparent); }
  body[data-team] .frame { opacity: 1; }
  body[data-mode="voting"] .frame, body[data-mode="closing"] .frame { animation: glow 1.2s ease-in-out infinite; }
  body[data-mode="closing"] .frame { animation-duration: 0.5s; }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 0.8vw var(--team), inset 0 0 5vw var(--team); } }

  /* ---------- 위 가운데: 곡 정보 ---------- */
  .head { position: fixed; left: 0; right: 0; top: 0; z-index: 2; text-align: center; padding: 2.2vw 6vw 3.6vw;
    background: linear-gradient(180deg, rgba(14, 16, 52, 0.9) 0%, rgba(14, 16, 52, 0.7) 60%, transparent 100%);
    transform: translateY(-110%); transition: transform 0.6s cubic-bezier(.2,.8,.2,1); }
  body[data-mode="performing"] .head, body[data-mode="voting"] .head, body[data-mode="closing"] .head, body[data-mode="closed"] .head { transform: none; }
  .meta { display: inline-flex; align-items: center; gap: 1.2vw; font-family: var(--display); letter-spacing: 0.16em; }
  .teamtxt { font-size: 2.2vw; color: var(--team); text-shadow: 0 0 1.4vw color-mix(in srgb, var(--team) 70%, transparent); }
  .sep { width: 0.35vw; height: 0.35vw; border-radius: 50%; background: var(--muted); opacity: 0.7; }
  .status { font-size: 1.25vw; color: var(--muted); display: inline-flex; align-items: center; gap: 0.6vw; }
  .status .dot { width: 0.75vw; height: 0.75vw; border-radius: 50%; background: var(--muted); }
  body[data-mode="performing"] .status .dot { background: #ff5f7e; animation: blink 1s infinite; }
  body[data-mode="voting"] .status, body[data-mode="closing"] .status { color: var(--team); }
  body[data-mode="voting"] .status .dot, body[data-mode="closing"] .status .dot { background: var(--team); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .title { font-size: 4.2vw; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-top: 0.6vw; word-break: keep-all; overflow-wrap: anywhere;
    text-shadow: 0 0.3vw 1.6vw rgba(0,0,0,0.5); }
  .artist { font-size: 1.5vw; color: var(--muted); margin-top: 0.3vw; }
  .note { margin-top: 1vw; font-size: 1.4vw; font-weight: 800; color: var(--muted); min-height: 1em; }
  body[data-mode="closing"] .note { color: var(--team); font-size: 1.8vw; }
  .cd { display: inline-block; font-family: var(--display); font-size: 2.8vw; margin: 0 0.3vw; vertical-align: -0.35vw; color: var(--team); text-shadow: 0 0 1.4vw var(--team); }
  .cd.tick { animation: tick 0.35s ease-out; }
  @keyframes tick { from { transform: scale(1.4); } }

  /* ---------- 결과 TOP 5 ---------- */
  .result { position: fixed; left: 50%; top: 50%; z-index: 3; transform: translate(-50%, -50%) scale(0.96); opacity: 0; pointer-events: none;
    width: min(62vw, 1200px); padding: 2.2vw 2.6vw; background: rgba(18, 20, 62, 0.86); border: 0.1vw solid rgba(184,189,246,0.35);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity 0.5s, transform 0.5s; }
  body[data-mode="results"] .result { opacity: 1; transform: translate(-50%, -50%); }
  .result::before, .result::after { content: ''; position: absolute; width: 1.6vw; height: 1.6vw; border: 0.22vw solid var(--lime); }
  .result::before { top: -0.22vw; left: -0.22vw; border-right: 0; border-bottom: 0; }
  .result::after { bottom: -0.22vw; right: -0.22vw; border-left: 0; border-top: 0; }
  .result h2 { margin: 0 0 1vw; font-family: var(--display); font-weight: 400; font-size: 2vw; letter-spacing: 0.2em; color: var(--lime); text-align: center; }
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: grid; grid-template-columns: 4vw 5vw 1fr auto; align-items: center; gap: 1vw; padding: 0.8vw 0.8vw; border-bottom: 0.08vw solid rgba(184,189,246,0.25); }
  .rank li:last-child { border-bottom: 0; }
  .rank .pos { font-size: 2.4vw; font-weight: 900; color: var(--muted); text-align: center; }
  .rank li.podium .pos { color: var(--lime); font-size: 2.9vw; }
  .rank li.top1 { background: linear-gradient(90deg, rgba(200,242,90,0.2), transparent); }
  .rank .tm { font-family: var(--display); font-size: 1.3vw; letter-spacing: 0.1em; }
  .rank .tm.A { color: var(--ob); } .rank .tm.B { color: var(--yb); }
  .rank .t { min-width: 0; }
  .rank .t b { display: block; font-size: 2vw; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .t small { font-size: 1.05vw; color: var(--muted); }
  .rank .v { font-size: 2.2vw; font-weight: 900; }
  .rank.many li { padding: 0.45vw 0.8vw; } .rank.many .t b { font-size: 1.7vw; } .rank.many .pos { font-size: 2vw; }
  .rank.cols { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; column-gap: 2vw; }
  .rank.cols li { grid-template-columns: 3vw 3.8vw 1fr auto; padding: 0.45vw 0.6vw; }
  .rank.cols .t b { font-size: 1.4vw; } .rank.cols .pos { font-size: 1.8vw; } .rank.cols .v { font-size: 1.6vw; }
  .fsg { display: inline-block; width: 0.95em; height: 1.3em; vertical-align: -0.3em; background: currentColor;
    -webkit-mask: url('/fsg-logo.png') center / contain no-repeat; mask: url('/fsg-logo.png') center / contain no-repeat; }

  /* 연결 끊김 표시 (오른쪽 아래 작게) */
  .net { position: fixed; right: 1.2vw; bottom: 1.2vw; z-index: 20; display: flex; align-items: center; gap: 0.5vw;
    background: #ff5f7e; color: #fff; font-weight: 800; font-size: 1vw; padding: 0.5vw 1vw; border-radius: 3px;
    transform: translateY(300%); transition: transform 0.25s; }
  .net.show { transform: none; }
  .net .spin { width: 0.9vw; height: 0.9vw; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="tint"></div>
<div class="tint2"></div>
<div class="frame"></div>

<header class="head" id="head"></header>
<section class="result" id="result"></section>

<div class="net" id="net" role="status" aria-live="polite"><span class="spin"></span>연결이 끊겼어요 · 다시 연결하는 중…</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 연결 상태 감시 ----------
// 2번 연속 실패하거나 기기가 오프라인이 되면 '연결 끊김' 표시, 다시 성공하면 자동으로 숨김
const NET = { fails: 0, down: false };
async function fetchT(url, opts = {}, ms = 6000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); } finally { clearTimeout(t); }
}
function showNet(on) { const n = document.getElementById('net'); if (n) n.classList.toggle('show', on); }
function netOk() { NET.fails = 0; if (NET.down) { NET.down = false; showNet(false); } }
function netFail() { NET.fails++; if (!NET.down && (NET.fails >= 2 || !navigator.onLine)) { NET.down = true; showNet(true); } }
window.addEventListener('offline', () => { NET.down = true; showNet(true); });
window.addEventListener('online', () => load());

// ---------- 마감 카운트다운 ----------
let deadline = null, cdReload = false;
function syncDeadline(st) {
  if (st && st.closing && st.closeIn != null) { const d = Date.now() + st.closeIn; if (!deadline || Math.abs(d - deadline) > 800) deadline = d; }
  else deadline = null;
}
function secsLeft() { return deadline ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) : ''; }
setInterval(() => {
  if (!deadline) return;
  const n = String(secsLeft());
  document.querySelectorAll('[data-cd]').forEach((e) => {
    if (e.textContent !== n) { e.textContent = n; e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick'); }
  });
  if (n === '0' && !cdReload) { cdReload = true; setTimeout(() => { cdReload = false; load(); }, 500); }
}, 200);

let lastKey = '';
async function load() {
  let S;
  try { S = await (await fetchT('/api/state', { cache: 'no-store' })).json(); netOk(); } catch { netFail(); return; }
  syncDeadline(S);
  const key = JSON.stringify([S.current, S.phase, S.closing, S.showResults, S.results, S.teams]);
  if (key === lastKey) return;
  lastKey = key;
  render(S);
}

function render(S) {
  const c = S.current;
  const res = S.showResults && S.results;
  const active = c && S.phase !== 'idle';
  const mode = res ? 'results' : !active ? 'idle' : S.phase === 'voting' ? (S.closing ? 'closing' : 'voting') : S.phase;
  document.body.dataset.mode = mode;
  // 팀 차례: 결과 발표·대기 중에는 원래 포스터 색
  if (active && !res) document.body.dataset.team = c.team; else delete document.body.dataset.team;

  if (active && !res) {
    const status = { performing: 'NOW ON STAGE', voting: 'VOTE OPEN', closing: 'LAST CALL', closed: 'VOTE CLOSED' }[mode];
    const note = mode === 'closing' ? `투표 마감까지 <b class="cd" data-cd>${secsLeft()}</b>초`
      : mode === 'closed' ? '투표가 마감됐어요' : '';
    $('head').innerHTML = `
      <div class="meta"><span class="teamtxt">${esc(S.teams[c.team])}</span><span class="sep"></span><span class="status"><span class="dot"></span>${status}</span></div>
      <div class="title">${esc(c.title)}</div>
      <div class="artist">${esc(c.artist)}</div>
      <div class="note">${note}</div>`;
  }

  if (res) {
    // 득표순, 동점은 같은 순위, 공동 5위까지 (0표 제외)
    const sorted = [...res.songs].sort((a, b) => b.votes - a.votes || a.order - b.order);
    let pos = 0;
    const ranked = sorted.map((s, i) => { if (i === 0 || s.votes !== sorted[i - 1].votes) pos = i + 1; return { ...s, pos }; })
      .filter((s) => s.pos <= 5 && s.votes > 0);
    $('result').innerHTML = `<h2>TOP 5</h2>
      <ol class="rank ${ranked.length > 7 ? 'cols' : ranked.length > 5 ? 'many' : ''}" style="grid-template-rows: repeat(${Math.ceil(ranked.length / 2)}, auto)">${ranked.map((s) => `
        <li class="${s.pos <= 3 ? 'podium' : ''} ${s.pos === 1 ? 'top1' : ''}">
          <span class="pos">${s.pos}</span>
          <span class="tm ${s.team}">${esc(S.teams[s.team])}</span>
          <span class="t"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></span>
          <span class="v"><span class="fsg" aria-hidden="true"></span> ${s.votes}</span>
        </li>`).join('') || '<li><span></span><span></span><span class="t"><b>아직 집계된 표가 없어요</b></span></li>'}</ol>`;
  }
}

load();
setInterval(load, 2000);
</script>
</body>
</html>
